<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- MANDATORY: Declare support for both light and dark themes to avoid FOUC -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="description" content="SoftFin — Controle financeiro rápido, sem atrito e 100% funcional offline." />

    <!-- Apple iOS / iPadOS PWA Standalone Config -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Resource Hints Estratégicos (Firebase Endpoints) -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />

    <title>SoftFin — Gestão Financeira Inteligente</title>

    <!-- Critical CSS Inline para App Shell Instantâneo (Zero CLS / LCP < 1.8s) -->
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
